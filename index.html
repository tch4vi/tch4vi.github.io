---
layout: default
title: Home
---
<section>
  <h2>Writeups</h2>
  <ul class="writeup-list">
    {% assign sorted = site.writeups | sort: "date" | reverse %}
    {% for w in sorted %}
    <li>
      <a href="{{ w.url }}" class="writeup-link">{{ w.title }}</a>
      <span class="platform">{{ w.platform }} · {{ w.date | date: "%B %d, %Y" }}</span>
    </li>
    {% endfor %}
  </ul>
</section>
