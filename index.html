---
layout: default
title: Home
---

<section>
  <h2>Latest writeup</h2>

  {% assign latest = site.writeups | sort: "date" | last %}
  <div class="card">
    <h3>{{ latest.title }}</h3>
    <p>{{ latest.platform }}</p>
    <a href="{{ latest.url }}">Read writeup →</a>
  </div>
</section>

<section>
  <h2>All writeups</h2>
  <ul>
    {% for w in site.writeups %}
      <li>
        <a href="{{ w.url }}">{{ w.title }}</a>
        <small>({{ w.platform }})</small>
      </li>
    {% endfor %}
  </ul>
</section>
